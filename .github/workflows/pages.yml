name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controllo dati (solo avvisi)
        run: node tools/check-data.js
        continue-on-error: true
      - name: Prepara il sito
        run: |
          mkdir _site
          cp "Tier List RPG & JRPG di Mario.html" _site/index.html
          cp style.css theme.css packs.css packs.js icone.js voti.js gusto.js dna.js media.js idee.js ordine.js cervello.js voce.js sospetti.js motion.js app.js app-schede.js app-utente.js app-ai.js chiavi-cifrate.js acquisto.js cinema.js guida.js shots.js gemini.js loader.js sources.js facts.js discoveries.js sync.js genres.js verify.js fx.js extras.js extras2.js extras3.js extras4.js qrcode.min.js music.js pet.js radar.js ost.js quality.js palettes.js intro.js giochi.js tratti.js pagine.js avvisi.js archivio.js manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          cp -r dati _site/dati
          cp -r packs _site/packs
          cp -r fonts _site/fonts
          cp -r backup-aurora _site/backup-aurora
          # la copia congelata (backup-aurora, intatta nel repo) si aspetta i dati nel formato VECCHIO: glieli preparo al volo nella versione pubblicata
          node tools/legacy-bundle.js _site/backup-aurora/legacy-giochi.js
          sed -i 's#<script src="../giochi.js"></script>#<script src="legacy-giochi.js"></script>#' _site/backup-aurora/index.html
          grep -q 'legacy-giochi.js' _site/backup-aurora/index.html
          # app Anime & Manga (cartella anime-manga/, indirizzo .../TierListGame/anime-manga/): tutto tranne gli strumenti del server
          cp -r anime-manga _site/anime-manga
          rm -rf _site/anime-manga/tools
          grep -q '<meta name="build"' _site/anime-manga/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
