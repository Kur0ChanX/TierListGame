name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controllo dati (solo avvisi)
        run: node tools/check-data.js
        continue-on-error: true
      - name: Prepara il sito
        run: |
          mkdir _site
          cp "Tier List RPG & JRPG di Mario.html" _site/index.html
          cp style.css theme.css app.js app-schede.js app-utente.js app-ai.js gemini.js loader.js sources.js facts.js discoveries.js sync.js genres.js verify.js fx.js extras.js extras2.js palettes.js intro.js giochi.js giochi-dettagli.js manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          cp -r backup-aurora _site/backup-aurora
          # la copia congelata si aspetta enrich/dopa dentro giochi.js: le riunisco al volo nella versione pubblicata (i suoi file nel repo restano intatti)
          sed -i 's#<script src="../giochi.js"></script>#<script src="../giochi.js"></script><script src="../giochi-dettagli.js"></script><script>Object.assign(GIOCHI_DATA,GIOCHI_DETAILS);</script>#' _site/backup-aurora/index.html
          grep -q 'giochi-dettagli.js' _site/backup-aurora/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
