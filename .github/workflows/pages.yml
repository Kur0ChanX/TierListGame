name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controllo dati (solo avvisi)
        run: node tools/check-data.js
        continue-on-error: true
      - name: Prepara il sito
        run: |
          mkdir _site
          cp "Tier List RPG & JRPG di Mario.html" _site/index.html
          cp style.css theme.css app.js app-schede.js app-utente.js app-ai.js gemini.js sync.js genres.js verify.js fx.js extras.js intro.js giochi.js manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
