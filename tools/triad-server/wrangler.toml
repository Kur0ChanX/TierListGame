# Server online del Triple Triad di Frugu (Cloudflare Workers + Durable Object con SQLite, piano gratuito).
# Si pubblica da solo con .github/workflows/triad-server.yml (servono i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID).
name = "frugu-triad"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
TURN_MS = "60000"
