name: Dati settimanali (Steam, GOG, CheapShark, Wikipedia)
# Ogni lunedì scarica dai SERVER (dove il browser non ha blocchi) i dati che l'app usa per cercare e controllare i giochi:
#  - facts.js: lingue italiane ufficiali su Steam, prezzo in euro con sconto, Metascore e % di recensioni per ogni gioco del database
#  - discoveries.js: migliaia di giochi da scoprire (Steam, GOG, CheapShark, Wikipedia, RAWG se c'è il segreto RAWG_API_KEY)
# Ogni notte (01:23 UTC) un giro leggero, anche a telefono spento: prezzi Steam del giorno, radar delle uscite (radar.js) e controllo qualità (quality.js).
# Il lunedì il giro completo: giochi da scoprire, dati dei giochi con il termometro delle recensioni, colonne sonore (ost.js).
# Nessun dato dei giochi viene cambiato da solo: l'app li usa per PROPORRE correzioni (le approvi tu) e come fonte della ricerca.
on:
  schedule:
    - cron: '17 3 * * 1'
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: dati-settimanali
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Giochi da scoprire (solo giro completo)
        if: github.event.schedule != '23 1 * * *'
        run: node tools/build-discoveries.js
        env:
          RAWG_KEY: ${{ secrets.RAWG_API_KEY }}
      - name: Dati sui giochi (lingue, prezzi, voti)
        if: github.event.schedule != '23 1 * * *'
        run: node tools/build-facts.js
      - name: Prezzi di oggi (giro notturno leggero)
        if: github.event.schedule == '23 1 * * *'
        run: node tools/build-facts.js --light
      - name: Radar delle uscite (ogni notte)
        run: node tools/build-radar.js
        continue-on-error: true
      - name: Colonne sonore (solo giro completo)
        if: github.event.schedule != '23 1 * * *'
        run: node tools/build-ost.js
        continue-on-error: true
      - name: Controllo qualità (ogni notte)
        run: node tools/build-quality.js
        continue-on-error: true
      - name: Controllo dati
        run: node tools/check-data.js
        continue-on-error: true
      - name: Salva e ripubblica il sito
        run: |
          git config user.name "raccoon-bot"
          git config user.email "raccoon-bot@users.noreply.github.com"
          git add facts.js discoveries.js radar.js ost.js quality.js
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Dati automatici: prezzi, radar, qualità (e ogni lunedì scoperte, termometro, colonne sonore)"
            git push
            gh workflow run pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
